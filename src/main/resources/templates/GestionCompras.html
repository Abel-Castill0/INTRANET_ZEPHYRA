<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/GestionCompras.css">
</head>
<body>
<div th:replace="fragmentos/navbar :: navbar"></div>

<div class="main-content">
    <div class="container">
        <h2>Carrito de Compras</h2>

        <!-- Control de acceso basado en el rol -->
        <div th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}">
            <h4>Bienvenido, administrador</h4>
            <a href="/admin-dashboard" class="btn btn-info">Ir al Dashboard</a>
        </div>

        <div th:if="${#authorization.expression('hasRole(''ROLE_CLIENTE'')')}">
            <h4>Bienvenido, cliente</h4>
            <!-- Aquí se pueden mostrar las opciones de carrito y pago -->
            <table class="table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio (S/)</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="carritoProductos">
                    <!-- Productos del carrito aquí -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" class="text-end">TOTAL:</td>
                        <td id="total">S/ 0.00</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div th:if="${#authorization.expression('!hasRole(''ROLE_ADMIN'') and !hasRole(''ROLE_CLIENTE'')')}">
            <h4>No tienes acceso a esta página</h4>
        </div>

        <form action="#" th:action="@{/finalizarCompra}" method="post">
            <button type="submit" class="btn btn-success">Finalizar Compra</button>
        </form>
    </div>
</div>

<script th:src="@{/js/carrito.js}"></script>
<script th:src="@{/js/jquery-3.6.0.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
